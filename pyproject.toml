[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datex"
dynamic = ["version"]
description = "Symbolic day-sets over the unbounded Julian Day Number universe: exact constraints, a gapless set algebra, and sorted joint projection across calendar systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josh Lee" }]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cterdam/datex"

# Single source of truth: __version__ in the package itself, so the value is
# available when running from a source checkout (PYTHONPATH=src, as CI does)
# and cannot drift from the distribution metadata.
[tool.hatch.version]
path = "src/datex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datex"]
